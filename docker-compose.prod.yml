# Eden en el servidor (droplet de DigitalOcean, 1 GB de RAM).
#   1. cp .env.ejemplo .env   (y llena los valores)
#   2. docker compose -f docker-compose.prod.yml up -d --build
# Solo Caddy queda expuesto a internet (puertos 80 y 443). La app y la base
# de datos viven en la red interna de Docker y no son accesibles desde fuera.
name: eden

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: eden
      POSTGRES_USER: eden
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      TZ: America/Bogota
    volumes:
      - datos_eden:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eden -d eden"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/eden
      DB_USER: eden
      DB_PASSWORD: ${DB_PASSWORD}
      APP_CODIGO_INVITACION: ${APP_CODIGO_INVITACION:?Define APP_CODIGO_INVITACION en el archivo .env}
      APP_CLAVE_RECORDARME: ${APP_CLAVE_RECORDARME:?Define APP_CLAVE_RECORDARME en el archivo .env}
      TZ: America/Bogota
      # Memoria ajustada a un droplet de 1 GB (queda espacio para PostgreSQL y Caddy).
      JAVA_TOOL_OPTIONS: "-Xmx320m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en el archivo .env (ej. eden-roger.duckdns.org)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config

volumes:
  datos_eden:
  caddy_datos:
  caddy_config:
