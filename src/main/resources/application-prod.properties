# Perfil de produccion (docker-compose.prod.yml lo activa con SPRING_PROFILES_ACTIVE=prod)
spring.thymeleaf.cache=true
logging.level.com.eden=INFO

# Detras de un proxy HTTPS (Tailscale Serve): respetar las cabeceras X-Forwarded-*
# y usar redirecciones relativas para no saltar a http:// por error.
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true
server.servlet.session.cookie.secure=true
