# Perfil de produccion (docker-compose.prod.yml lo activa con SPRING_PROFILES_ACTIVE=prod)
spring.thymeleaf.cache=true
logging.level.com.eden=INFO

# Detras de Caddy (HTTPS): Tomcat toma la IP real del visitante y el esquema https
# de las cabeceras X-Forwarded-For / X-Forwarded-Proto. Solo confia en proxies de
# redes privadas (la red interna de Docker), asi nadie puede falsificar su IP.
server.forward-headers-strategy=native
server.tomcat.use-relative-redirects=true
server.servlet.session.cookie.secure=true
