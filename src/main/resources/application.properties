spring.application.name=eden

# Nombre visible de la aplicacion (cambiar aqui cuando se defina el definitivo)
app.nombre=${APP_NOMBRE:Eden}
# Codigo requerido para crear una cuenta. Sin valor, la aplicacion no arranca.
app.codigo-invitacion=${APP_CODIGO_INVITACION:}

# Base de datos (valores por defecto para desarrollo local con docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finanzas}
spring.datasource.username=${DB_USER:finanzas}
spring.datasource.password=${DB_PASSWORD:finanzas}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sesion
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.error.whitelabel.enabled=false
spring.jackson.time-zone=America/Bogota
# Clave para firmar la cookie "recordarme". Sin valor, la aplicacion no arranca.
app.clave-recordarme=${APP_CLAVE_RECORDARME:}
