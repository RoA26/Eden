<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Registrar producido')}"></head>
<body x-data="aplicacion" @keydown.escape.window="escape">
<div class="marco">
    <th:block th:replace="~{fragmentos/navegacion :: navegacion('Producido del día', 'registrar')}"></th:block>

    <main class="animate-fade-in contenido lg:max-w-xl">
        <div th:replace="~{fragmentos/componentes :: avisos}"></div>

        <!-- Calculadora: un numero para la fuente principal, sin exigir crear una fuente antes -->
        <section class="tarjeta p-5">
            <form th:replace="~{fragmentos/modales :: formProducido(@{/inicio})}"></form>
        </section>

        <!-- Registro completo (ingreso + costo del dia), para quien ya tiene fuentes -->
        <details class="desplegable" th:unless="${fuentes.isEmpty()}"
                 th:attr="open=${formulario.monto != null} ? 'open' : null">
            <summary>Registrar también el costo del día</summary>
            <form th:action="@{/registrar}" th:object="${formulario}" method="post" class="formulario" novalidate>
                <p th:if="${#fields.hasGlobalErrors()}" class="aviso aviso-error" role="alert" th:text="${#fields.globalErrors()[0]}"></p>

                <label for="monto">Producido</label>
                <input id="monto" type="text" inputmode="decimal" th:field="*{monto}" placeholder="$ 120.000"
                       class="entrada-monto" th:classappend="${#fields.hasErrors('monto')} ? 'con-error'">
                <p class="error-campo" th:if="${#fields.hasErrors('monto')}" th:errors="*{monto}"></p>

                <div class="grid grid-cols-2 gap-3">
                    <div class="grid gap-1.5">
                        <label for="fecha" class="etiqueta">Fecha</label>
                        <input id="fecha" type="date" class="campo" th:field="*{fecha}"
                               th:classappend="${#fields.hasErrors('fecha')} ? 'con-error'">
                    </div>
                    <div class="grid gap-1.5">
                        <label for="idFuente" class="etiqueta">Fuente</label>
                        <select id="idFuente" class="campo" th:field="*{idFuente}">
                            <option th:each="f : ${fuentes}" th:value="${f.id}" th:text="${f.nombre}">Motocarro</option>
                        </select>
                    </div>
                </div>
                <p class="error-campo" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></p>
                <p class="error-campo" th:if="${#fields.hasErrors('idFuente')}" th:errors="*{idFuente}"></p>

                <label for="idCategoriaIngreso">Categoría del ingreso</label>
                <select id="idCategoriaIngreso" th:field="*{idCategoriaIngreso}">
                    <option th:each="c : ${categoriasIngreso}" th:value="${c.id}" th:text="${c.nombre}">Producido</option>
                </select>
                <p class="error-campo" th:if="${#fields.hasErrors('idCategoriaIngreso')}" th:errors="*{idCategoriaIngreso}"></p>

                <label for="costo">Costo del día (opcional)</label>
                <input id="costo" type="text" inputmode="decimal" th:field="*{costo}" placeholder="Ej. 20.000 de gasolina"
                       class="entrada-monto" th:classappend="${#fields.hasErrors('costo')} ? 'con-error'">
                <p class="error-campo" th:if="${#fields.hasErrors('costo')}" th:errors="*{costo}"></p>

                <label for="idCategoriaCosto">Tipo de costo</label>
                <select id="idCategoriaCosto" th:field="*{idCategoriaCosto}">
                    <option th:each="c : ${categoriasCosto}" th:value="${c.id}" th:text="${c.nombre}">Combustible</option>
                </select>
                <p class="error-campo" th:if="${#fields.hasErrors('idCategoriaCosto')}" th:errors="*{idCategoriaCosto}"></p>

                <button type="submit" class="boton boton-principal">Guardar producido y costo</button>
            </form>
        </details>

        <p class="flex justify-center gap-5 text-sm">
            <a class="enlace" th:href="@{/movimientos/nuevo(tipo='GASTO')}">Registrar un gasto</a>
            <a class="enlace" th:href="@{/movimientos/nuevo(tipo='INGRESO')}">Otro ingreso</a>
        </p>
    </main>

    <div th:replace="~{fragmentos/componentes :: globales}"></div>
</div>
</body>
</html>
