<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Movimientos')}"></head>
<body x-data="aplicacion" @keydown.escape.window="escape">
<div class="marco">
    <th:block th:replace="~{fragmentos/navegacion :: navegacion('Movimientos', 'movimientos')}"></th:block>

    <main class="animate-fade-in contenido">
        <div th:replace="~{fragmentos/componentes :: bannerCompartido}"></div>
        <div th:replace="~{fragmentos/componentes :: avisos}"></div>

        <div class="grid grid-cols-2 gap-2" th:unless="${soloLectura}">
            <a class="boton boton-claro" th:href="@{/movimientos/nuevo(tipo='GASTO')}">
                <span class="text-coral-claro">−</span> Nuevo gasto</a>
            <a class="boton boton-claro" th:href="@{/movimientos/nuevo(tipo='INGRESO')}">
                <span class="text-esmeralda">+</span> Nuevo ingreso</a>
        </div>

        <section class="space-y-3">
            <div class="flex items-center justify-between gap-3">
                <p class="text-sm font-semibold" th:if="${filtro.desde != null and filtro.hasta != null}"
                   th:text="${@formato.fecha(filtro.desde)} + ' — ' + ${@formato.fecha(filtro.hasta)}">1 sep — 30 sep</p>
            </div>

            <details class="desplegable">
                <summary>Filtrar</summary>
                <form th:action="@{${baseRuta + '/movimientos'}}" th:object="${filtro}" method="get" class="formulario">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="grid gap-1.5">
                            <label for="desde" class="etiqueta">Desde</label>
                            <input id="desde" type="date" class="campo" th:field="*{desde}">
                        </div>
                        <div class="grid gap-1.5">
                            <label for="hasta" class="etiqueta">Hasta</label>
                            <input id="hasta" type="date" class="campo" th:field="*{hasta}">
                        </div>
                    </div>
                    <label for="tipo">Tipo</label>
                    <select id="tipo" th:field="*{tipo}">
                        <option value="">Todos</option>
                        <option th:each="tp : ${tipos}" th:value="${tp}" th:text="${tp.etiqueta}">Ingreso</option>
                    </select>
                    <label for="idCategoria">Categoría</label>
                    <select id="idCategoria" th:field="*{idCategoria}">
                        <option value="">Todas</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}">Combustible</option>
                    </select>
                    <label for="idFuente">Fuente</label>
                    <select id="idFuente" th:field="*{idFuente}">
                        <option value="">Todas</option>
                        <option th:each="f : ${fuentes}" th:value="${f.id}" th:text="${f.nombre}">Motocarro</option>
                    </select>
                    <button type="submit" class="boton boton-principal">Aplicar filtros</button>
                </form>
            </details>

            <dl class="cifras grid-cols-3">
                <div><dt>Ingresos</dt><dd class="monto-ingreso text-sm" th:text="${@formato.pesos(pagina.totalIngresos())}">$ 0</dd></div>
                <div><dt>Gastos</dt><dd class="monto-gasto text-sm" th:text="${@formato.pesos(pagina.totalGastos())}">$ 0</dd></div>
                <div><dt>Balance</dt><dd class="text-sm" th:text="${@formato.pesos(pagina.balance())}">$ 0</dd></div>
            </dl>
        </section>

        <section>
            <p class="vacio" th:if="${pagina.movimientos().isEmpty()}">No hay movimientos en este periodo.</p>
            <div class="lista" id="lista-movimientos" th:unless="${pagina.movimientos().isEmpty()}">
                <th:block th:each="m : ${pagina.movimientos()}">
                    <article th:replace="~{fragmentos/componentes :: filaMovimiento(${m}, '/movimientos')}"></article>
                </th:block>
            </div>
        </section>

        <!-- "Cargar mas": agrega la pagina siguiente a la lista sin recargar (Alpine).
             Sin JavaScript es un enlace normal a la pagina siguiente. -->
        <nav class="grid gap-2" aria-label="Paginación" x-data="cargarMas"
             th:if="${pagina.hayAnterior() or pagina.haySiguiente()}">
            <a th:if="${pagina.haySiguiente()}" data-cargar-mas data-lista="lista-movimientos"
               class="boton boton-claro boton-bloque" @click.prevent="cargar" :aria-busy="cargando ? 'true' : 'false'"
               th:href="@{${baseRuta + '/movimientos'}(desde=${filtro.desde},hasta=${filtro.hasta},tipo=${filtro.tipo},idCategoria=${filtro.idCategoria},idFuente=${filtro.idFuente},pagina=${pagina.pagina() + 1})}">
                <span class="spinner" x-cloak x-show="cargando"></span>Cargar más movimientos
            </a>
            <a th:if="${pagina.hayAnterior()}" class="justify-self-center text-xs font-semibold text-tinta-suave hover:text-tinta"
               th:href="@{${baseRuta + '/movimientos'}(desde=${filtro.desde},hasta=${filtro.hasta},tipo=${filtro.tipo},idCategoria=${filtro.idCategoria},idFuente=${filtro.idFuente},pagina=${pagina.pagina() - 1})}">‹ Ver los más recientes</a>
        </nav>
    </main>

    <div th:replace="~{fragmentos/componentes :: globales}"></div>
</div>
</body>
</html>
