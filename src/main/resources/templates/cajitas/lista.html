<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Cajitas')}"></head>
<body x-data="aplicacion" @keydown.escape.window="escape">
<div class="marco">
    <th:block th:replace="~{fragmentos/navegacion :: navegacion('Cajitas', 'cajitas')}"></th:block>

    <main class="animate-fade-in contenido">
        <div th:replace="~{fragmentos/componentes :: avisos}"></div>

        <section class="tarjeta flex items-center justify-between gap-4 p-5">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-tinta-tenue">Por repartir</p>
                <p class="mt-1 text-3xl font-extrabold tabular-nums tracking-tight" th:text="${@formato.pesos(disponible)}">$ 0</p>
            </div>
            <a class="boton boton-principal boton-pequeno" th:if="${disponible.signum() > 0 and !cajitas.isEmpty()}"
               th:href="@{/cajitas/repartir}">Repartir</a>
        </section>

        <section th:unless="${cajitas.isEmpty()}">
            <div class="grid grid-cols-2 gap-3">
                <th:block th:each="c : ${cajitas}">
                    <a th:replace="~{fragmentos/componentes :: tarjetaCajita(${c}, true)}"></a>
                </th:block>
            </div>
        </section>

        <details class="desplegable" th:attr="open=${abrirFormulario != null or cajitas.isEmpty()} ? 'open' : null">
            <summary>Nueva cajita</summary>
            <form th:action="@{/cajitas}" th:object="${formulario}" method="post" class="formulario" novalidate>
                <p th:if="${#fields.hasGlobalErrors()}" class="aviso aviso-error" role="alert" th:text="${#fields.globalErrors()[0]}"></p>

                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" maxlength="40" placeholder="Ej. Daniela"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'con-error'">
                <p class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>

                <label for="proposito">Propósito</label>
                <select id="proposito" th:field="*{proposito}">
                    <option th:each="p : ${propositos}" th:value="${p}" th:text="${p.etiqueta}">Capital</option>
                </select>

                <label for="porcentaje">Porcentaje de cada reparto</label>
                <input id="porcentaje" type="number" min="0" max="100" step="0.5" th:field="*{porcentaje}"
                       th:classappend="${#fields.hasErrors('porcentaje')} ? 'con-error'">
                <p class="error-campo" th:if="${#fields.hasErrors('porcentaje')}" th:errors="*{porcentaje}"></p>

                <label class="casilla">
                    <input type="checkbox" th:field="*{esResto}">
                    Esta cajita recibe lo que sobra (como Chelas)
                </label>

                <label for="saldoInicial">Saldo que ya tiene en Nu (opcional)</label>
                <input id="saldoInicial" type="text" inputmode="decimal" th:field="*{saldoInicial}" placeholder="Ej. 1.500.000"
                       class="entrada-monto" th:classappend="${#fields.hasErrors('saldoInicial')} ? 'con-error'">
                <p class="error-campo" th:if="${#fields.hasErrors('saldoInicial')}" th:errors="*{saldoInicial}"></p>

                <button type="submit" class="boton boton-principal">Crear cajita</button>
            </form>
        </details>
    </main>

    <div th:replace="~{fragmentos/componentes :: globales}"></div>
</div>
</body>
</html>
