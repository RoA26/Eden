<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Fuentes de ingreso')}"></head>
<body x-data="aplicacion" @keydown.escape.window="escape">
<div class="marco">
    <th:block th:replace="~{fragmentos/navegacion :: navegacion('Fuentes de ingreso', 'fuentes')}"></th:block>

    <main class="animate-fade-in contenido">
        <div th:replace="~{fragmentos/componentes :: avisos}"></div>

        <section>
            <p class="vacio" th:if="${fuentes.isEmpty()}">Aún no tienes fuentes. Crea la primera abajo.</p>
            <div class="space-y-3">
                <article class="tarjeta space-y-3" th:each="f : ${fuentes}" th:classappend="${!f.activa} ? 'inactiva'">
                    <form th:action="@{/fuentes/{id}(id=${f.id})}" method="post" class="grid gap-2">
                        <input type="text" name="nombre" th:value="${f.nombre}" maxlength="60" class="campo"
                               aria-label="Nombre de la fuente" required>
                        <div class="en-linea">
                            <select name="frecuencia" class="campo" aria-label="Frecuencia">
                                <option th:each="fr : ${frecuencias}" th:value="${fr}" th:text="${fr.etiqueta}"
                                        th:selected="${fr == f.frecuencia}">Diaria</option>
                            </select>
                            <button type="submit" class="boton boton-claro">Guardar</button>
                        </div>
                    </form>
                    <form th:action="@{/fuentes/{id}/estado(id=${f.id})}" method="post" class="border-t border-borde pt-3">
                        <input type="hidden" name="activa" th:value="${!f.activa}">
                        <button type="submit" class="enlace text-xs" th:text="${f.activa} ? 'Desactivar' : 'Activar'">Desactivar</button>
                    </form>
                </article>
            </div>
        </section>

        <section>
            <h2 class="seccion-titulo mb-3">Nueva fuente</h2>
            <form th:action="@{/fuentes}" th:object="${formulario}" method="post" class="formulario tarjeta p-5" novalidate>
                <p th:if="${#fields.hasGlobalErrors()}" class="aviso aviso-error" role="alert" th:text="${#fields.globalErrors()[0]}"></p>
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" maxlength="60" placeholder="Ej. Motocarro"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'con-error'">
                <p class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>

                <label for="frecuencia">¿Cada cuánto recibes este ingreso?</label>
                <select id="frecuencia" th:field="*{frecuencia}">
                    <option th:each="fr : ${frecuencias}" th:value="${fr}" th:text="${fr.etiqueta}">Diaria</option>
                </select>

                <button type="submit" class="boton boton-principal">Crear fuente</button>
            </form>
        </section>
    </main>

    <div th:replace="~{fragmentos/componentes :: globales}"></div>
</div>
</body>
</html>
