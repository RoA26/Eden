<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Modales del tablero. Cada formulario conserva su th:action clasico (con el
    token CSRF que agrega Thymeleaf) y Alpine lo intercepta (@submit.prevent)
    para enviarlo por fetch al endpoint JSON de data-api.
    Requiere en el modelo: categoriasIngreso, categoriasGasto, categoriasCosto,
    fuentes, cajitasActivas, tiposCategoria y hoy (ver InicioController).
-->
<th:block th:fragment="modales">
    <div th:replace="~{fragmentos/componentes :: modal('producido', 'Producido del día', ~{fragmentos/modales :: formProducido(null)})}"></div>
    <div th:replace="~{fragmentos/componentes :: modal('movimiento', 'Registrar movimiento', ~{fragmentos/modales :: formMovimiento})}"></div>
    <div th:replace="~{fragmentos/componentes :: modal('atajo', 'Nuevo botón rápido', ~{fragmentos/modales :: formAtajo})}"></div>
    <div th:replace="~{fragmentos/componentes :: modal('categoria', 'Nueva categoría', ~{fragmentos/modales :: formCategoria})}"></div>
</th:block>

<!-- Selector Gasto / Ingreso (radios accesibles con aspecto de control segmentado) -->
<div th:fragment="selectorTipo" class="segmentos" role="radiogroup" aria-label="Tipo de movimiento">
    <label class="segmento segmento-gasto cursor-pointer" :class="esGasto() ? 'segmento-activo' : ''">
        <input type="radio" name="tipo" value="GASTO" class="sr-only" checked @change="elegirGasto">Gasto
    </label>
    <label class="segmento segmento-ingreso cursor-pointer" :class="esIngreso() ? 'segmento-activo' : ''">
        <input type="radio" name="tipo" value="INGRESO" class="sr-only" @change="elegirIngreso">Ingreso
    </label>
</div>

<!--
    Categoria segun el tipo elegido. Hay un selector por tipo y solo el visible
    queda habilitado (los campos deshabilitados no se envian). Los data-opciones-categoria
    permiten agregar al vuelo las categorias creadas desde el modal de categoria.
-->
<th:block th:fragment="selectorCategoria(prefijo)">
    <label th:for="${prefijo} + '-categoria-gasto'" x-show="esGasto()">Categoría</label>
    <select th:id="${prefijo} + '-categoria-gasto'" name="idCategoria" x-show="esGasto()" :disabled="esIngreso()"
            :class="claseError('idCategoria')">
        <optgroup label="Gastos personales" data-opciones-categoria="GASTO">
            <option th:each="c : ${categoriasGasto}" th:value="${c.id}" th:text="${c.nombre}">Alimentación</option>
        </optgroup>
        <optgroup label="Costos operativos (de una fuente)" data-opciones-categoria="COSTO_OPERATIVO">
            <option th:each="c : ${categoriasCosto}" th:value="${c.id}" th:text="${c.nombre}">Combustible</option>
        </optgroup>
    </select>
    <label th:for="${prefijo} + '-categoria-ingreso'" x-cloak x-show="esIngreso()">Categoría</label>
    <select th:id="${prefijo} + '-categoria-ingreso'" name="idCategoria" x-cloak x-show="esIngreso()" disabled
            :disabled="esGasto()" :class="claseError('idCategoria')" data-opciones-categoria="INGRESO">
        <option th:each="c : ${categoriasIngreso}" th:value="${c.id}" th:text="${c.nombre}">Producido</option>
    </select>
    <p class="error-campo" data-error-de="idCategoria" x-cloak x-show="tieneError('idCategoria')" x-text="errores.idCategoria"></p>
    <button type="button" class="enlace justify-self-start text-xs" @click="$store.ui.abrirModal('categoria', $store.ui.modal)">
        + Crear una categoría
    </button>
</th:block>

<!--
    Producido del dia como calculadora: un solo numero grande para la fuente
    principal activa (la primera; si hay varias se elige con un toque). No exige
    crear una fuente: sin fuentes se registra como ingreso "Producido" sin fuente.
    Se envia como ingreso normal (POST /api/movimientos; sin JavaScript, /movimientos/nuevo).
    irA: ruta a la que navegar al guardar (null en el modal del tablero).
-->
<form th:fragment="formProducido(irA)" th:action="@{/movimientos/nuevo}" method="post" class="grid gap-4" novalidate
      x-data="calculadora" @submit.prevent="enviar" data-sin-autofoco data-refrescar="ultimos,resumenMes"
      th:with="producidos=${categoriasIngreso.?[nombre == 'Producido']},
               categoria=${!producidos.isEmpty()} ? ${producidos[0]} : (${categoriasIngreso.isEmpty()} ? null : ${categoriasIngreso[0]}),
               fechaHoy=${hoy ?: formulario.fecha}"
      th:attr="data-api=@{/api/movimientos},data-ir-a=${irA}">
    <input type="hidden" name="tipo" value="INGRESO">
    <input type="hidden" name="idCategoria" th:value="${categoria != null} ? ${categoria.id} : ''">
    <input type="hidden" name="fecha" th:value="${fechaHoy}">

    <p class="aviso aviso-error" role="alert" x-cloak x-show="errorGeneral" x-text="errorGeneral"></p>

    <div class="rounded-3xl border border-borde bg-black/20 px-4 pb-4 pt-5 text-center">
        <label for="producido-monto" class="text-xs font-semibold uppercase tracking-wider text-tinta-tenue">¿Cuánto hiciste hoy?</label>
        <input id="producido-monto" name="monto" type="text" inputmode="numeric" autocomplete="off" placeholder="$ 0"
               class="calculadora-pantalla mt-2" :value="texto()" @input="escribir">
        <p class="error-campo mt-1" data-error-de="monto" x-cloak x-show="tieneError('monto')" x-text="errores.monto"></p>

        <div class="mt-3 flex flex-wrap justify-center gap-2" role="radiogroup" aria-label="Fuente">
            <span class="chip" th:if="${fuentes.isEmpty()}">Sin fuente asignada</span>
            <label class="chip-opcion has-[:checked]:border-esmeralda/40 has-[:checked]:bg-esmeralda/10 has-[:checked]:text-esmeralda-claro"
                   th:each="f, estado : ${fuentes}">
                <input type="radio" name="idFuente" class="sr-only" th:value="${f.id}" th:checked="${estado.first}">
                <span th:text="${f.nombre}">Motocarro</span>
            </label>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-2">
        <button type="button" class="chip-opcion justify-center py-2" @click="sumar(10000)">+ 10.000</button>
        <button type="button" class="chip-opcion justify-center py-2" @click="sumar(50000)">+ 50.000</button>
        <button type="button" class="chip-opcion justify-center py-2" @click="sumar(100000)">+ 100.000</button>
    </div>

    <div class="teclado" aria-label="Teclado numérico">
        <button type="button" class="tecla" @click="pulsar('1')">1</button>
        <button type="button" class="tecla" @click="pulsar('2')">2</button>
        <button type="button" class="tecla" @click="pulsar('3')">3</button>
        <button type="button" class="tecla" @click="pulsar('4')">4</button>
        <button type="button" class="tecla" @click="pulsar('5')">5</button>
        <button type="button" class="tecla" @click="pulsar('6')">6</button>
        <button type="button" class="tecla" @click="pulsar('7')">7</button>
        <button type="button" class="tecla" @click="pulsar('8')">8</button>
        <button type="button" class="tecla" @click="pulsar('9')">9</button>
        <button type="button" class="tecla tecla-suave" @click="pulsar('000')">000</button>
        <button type="button" class="tecla" @click="pulsar('0')">0</button>
        <button type="button" class="tecla tecla-suave" aria-label="Borrar" @click="borrar">⌫</button>
    </div>

    <button type="submit" class="boton boton-principal boton-bloque boton-grande" :disabled="enviando || vacio()">
        <span class="spinner" x-cloak x-show="enviando"></span>Guardar producido
    </button>
    <a th:href="@{/fuentes}" class="justify-self-center text-xs font-semibold text-tinta-suave hover:text-tinta">Administrar fuentes</a>
</form>

<!-- Registrar un ingreso o gasto sin atajo -->
<form th:fragment="formMovimiento" th:action="@{/movimientos/nuevo}" method="post" class="formulario" novalidate
      x-data="formularioConTipo" @submit.prevent="enviar"
      th:attr="data-api=@{/api/movimientos}" data-refrescar="ultimos,resumenMes">
    <p class="aviso aviso-error" role="alert" x-cloak x-show="errorGeneral" x-text="errorGeneral"></p>

    <div th:replace="~{fragmentos/modales :: selectorTipo}"></div>

    <label for="mov-monto">Monto</label>
    <input id="mov-monto" name="monto" type="text" inputmode="decimal" autocomplete="off" placeholder="$ 0"
           class="entrada-monto entrada-monto-grande" :class="claseError('monto')" autofocus>
    <p class="error-campo" data-error-de="monto" x-cloak x-show="tieneError('monto')" x-text="errores.monto"></p>

    <th:block th:replace="~{fragmentos/modales :: selectorCategoria('mov')}"></th:block>

    <label for="mov-fuente">Fuente</label>
    <select id="mov-fuente" name="idFuente" :class="claseError('idFuente')">
        <option value="">Ninguna</option>
        <option th:each="f : ${fuentes}" th:value="${f.id}" th:text="${f.nombre}">Motocarro</option>
    </select>
    <p class="ayuda" x-show="esGasto()">Obligatoria solo para costos operativos.</p>
    <p class="error-campo" data-error-de="idFuente" x-cloak x-show="tieneError('idFuente')" x-text="errores.idFuente"></p>

    <th:block th:unless="${cajitasActivas == null or cajitasActivas.isEmpty()}">
        <label for="mov-cajita" x-show="esGasto()">Pagado desde</label>
        <select id="mov-cajita" name="idCajitaOrigen" x-show="esGasto()" :disabled="esIngreso()"
                :class="claseError('idCajitaOrigen')">
            <option value="">El disponible</option>
            <option th:each="c : ${cajitasActivas}" th:value="${c.id}"
                    th:text="${c.nombre} + ' (' + ${@formato.pesos(c.saldo)} + ')'">Atenea</option>
        </select>
        <p class="error-campo" data-error-de="idCajitaOrigen" x-cloak x-show="tieneError('idCajitaOrigen')"
           x-text="errores.idCajitaOrigen"></p>
    </th:block>

    <div class="grid grid-cols-2 gap-3">
        <div class="grid gap-1.5">
            <label for="mov-fecha" class="etiqueta">Fecha</label>
            <input id="mov-fecha" name="fecha" type="date" class="campo" th:value="${hoy}" th:attr="max=${hoy}"
                   :class="claseError('fecha')">
        </div>
        <div class="grid gap-1.5">
            <label for="mov-descripcion" class="etiqueta">Nota (opcional)</label>
            <input id="mov-descripcion" name="descripcion" type="text" class="campo" maxlength="200" placeholder="Ej. almuerzo">
        </div>
    </div>
    <p class="error-campo" data-error-de="fecha" x-cloak x-show="tieneError('fecha')" x-text="errores.fecha"></p>
    <p class="error-campo" data-error-de="descripcion" x-cloak x-show="tieneError('descripcion')" x-text="errores.descripcion"></p>

    <button type="submit" class="boton boton-principal boton-bloque" :disabled="enviando">
        <span class="spinner" x-cloak x-show="enviando"></span>Guardar
    </button>
</form>

<!-- Crear un boton rapido (plantilla de registro de un toque) -->
<form th:fragment="formAtajo" th:action="@{/atajos}" method="post" class="formulario" novalidate
      x-data="formularioConTipo" @submit.prevent="enviar"
      th:attr="data-api=@{/api/atajos}" data-refrescar="atajos">
    <p class="ayuda -mt-2 mb-2">Un toque en el botón registra el movimiento con la fecha de hoy.</p>
    <p class="aviso aviso-error" role="alert" x-cloak x-show="errorGeneral" x-text="errorGeneral"></p>

    <div th:replace="~{fragmentos/modales :: selectorTipo}"></div>

    <div class="grid grid-cols-[1fr_auto] gap-3">
        <div class="grid gap-1.5">
            <label for="atajo-nombre" class="etiqueta">Nombre del botón</label>
            <input id="atajo-nombre" name="nombre" type="text" class="campo" maxlength="30" placeholder="Ej. Moto"
                   :class="claseError('nombre')" autofocus>
        </div>
        <div class="grid w-36 gap-1.5">
            <label for="atajo-monto" class="etiqueta">Monto</label>
            <input id="atajo-monto" name="monto" type="text" inputmode="decimal" class="campo entrada-monto"
                   autocomplete="off" placeholder="5.000" :class="claseError('monto')">
        </div>
    </div>
    <p class="error-campo" data-error-de="nombre" x-cloak x-show="tieneError('nombre')" x-text="errores.nombre"></p>
    <p class="error-campo" data-error-de="monto" x-cloak x-show="tieneError('monto')" x-text="errores.monto"></p>

    <th:block th:replace="~{fragmentos/modales :: selectorCategoria('atajo')}"></th:block>

    <label for="atajo-fuente">Fuente (opcional)</label>
    <select id="atajo-fuente" name="idFuente" :class="claseError('idFuente')">
        <option value="">Ninguna</option>
        <option th:each="f : ${fuentes}" th:value="${f.id}" th:text="${f.nombre}">Motocarro</option>
    </select>
    <p class="ayuda" x-show="esGasto()">Obligatoria para costos operativos, como la gasolina del motocarro.</p>
    <p class="ayuda" x-cloak x-show="esIngreso()">Un ingreso con fuente se registra una sola vez por día (producido diario).</p>
    <p class="error-campo" data-error-de="idFuente" x-cloak x-show="tieneError('idFuente')" x-text="errores.idFuente"></p>

    <button type="submit" class="boton boton-principal boton-bloque" :disabled="enviando">
        <span class="spinner" x-cloak x-show="enviando"></span>Crear botón
    </button>
</form>

<!-- Crear una categoria; si se abrio desde otro modal, vuelve a el con la categoria elegida -->
<form th:fragment="formCategoria" th:action="@{/categorias}" method="post" class="formulario" novalidate
      x-data="formularioAjax" @submit.prevent="enviar" th:attr="data-api=@{/api/categorias}">
    <p class="aviso aviso-error" role="alert" x-cloak x-show="errorGeneral" x-text="errorGeneral"></p>

    <label for="cat-nombre">Nombre</label>
    <input id="cat-nombre" name="nombre" type="text" maxlength="50" placeholder="Ej. Mascotas" autofocus
           :class="claseError('nombre')">
    <p class="error-campo" data-error-de="nombre" x-cloak x-show="tieneError('nombre')" x-text="errores.nombre"></p>

    <label for="cat-tipo">Tipo</label>
    <select id="cat-tipo" name="tipo" :class="claseError('tipo')">
        <option th:each="tp : ${tiposCategoria}" th:value="${tp}" th:text="${tp.etiqueta}"
                th:selected="${tp.name() == 'GASTO'}">Gasto personal</option>
    </select>
    <p class="error-campo" data-error-de="tipo" x-cloak x-show="tieneError('tipo')" x-text="errores.tipo"></p>

    <button type="submit" class="boton boton-principal boton-bloque" :disabled="enviando">
        <span class="spinner" x-cloak x-show="enviando"></span>Crear categoría
    </button>
</form>

</body>
</html>
