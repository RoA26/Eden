<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    Cabecera comun de todas las paginas. Las librerias se sirven desde el
    propio dominio (la CSP solo permite script-src 'self'):
      - eden.css: Tailwind compilado desde frontend/ (npm run css)
      - alpine-csp.min.js: Alpine.js, build compatible con CSP (sin eval)
      - tema.js: pone el tema claro/oscuro antes de pintar (sin defer)
      - eden.js: componentes de Alpine; se carga antes para registrarlos
-->
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121614">
    <meta name="color-scheme" content="dark light">
    <script th:src="@{/js/tema.js}"></script>
    <meta name="eden:base" th:content="@{/}">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${titulo} + ' | ' + ${nombreApp ?: 'Eden'}">Eden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/eden.css}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/iconos/icono-192.png}">
    <link rel="apple-touch-icon" th:href="@{/iconos/icono-180.png}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Eden">
    <script th:src="@{/js/eden.js}" defer></script>
    <script th:src="@{/js/vendor/alpine-csp.min.js}" defer></script>
</head>
<body>
</body>
</html>
